<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09223d" />
    <meta name="description" content="شاهد موشن فرضيات تمريضية: سيناريوهات تفاعلية، بنك أسئلة، ومتابعة التقدم." />
    <title>شاهد موشن فرضيات تمريضية</title>
    <style>
      :root { color-scheme: dark; font-family: Tahoma, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: #09223d; color: #f5fbfe; }
      main { width: min(100% - 32px, 680px); margin-inline: auto; padding-block: 24px 36px; text-align: center; }
      h1 { margin: 0 0 18px; font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.5; }
      video { display: block; width: min(100%, 390px); max-height: 74svh; aspect-ratio: 9 / 16; margin-inline: auto; background: #05192f; border-radius: 18px; object-fit: contain; box-shadow: 0 18px 42px rgba(0, 0, 0, .28); }
      p { color: #bad3dc; font-size: 1rem; line-height: 1.6; }
      nav { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin-block-start: 20px; }
      a { color: #f5fbfe; text-decoration: none; padding: 12px 18px; border: 1px solid #67d5d4; border-radius: 10px; min-height: 44px; }
      a.primary { background: #087f89; border-color: #087f89; }
      a:focus-visible { outline: 3px solid #f5fbfe; outline-offset: 3px; }
      @media (max-width: 420px) { main { padding-block-start: 16px; } video { max-height: 70svh; } }
    </style>
  </head>
  <body>
    <main>
      <h1>موشن فرضيات تمريضية</h1>
      <video controls playsinline preload="metadata" poster="./poster.png" aria-label="فيديو يشرح موقع فرضيات تمريضية">
        <source src="./nursing-hypotheses-motion-ar.mp4" type="video/mp4" />
        متصفحك لا يدعم تشغيل الفيديو. استخدم رابط التحميل بالأسفل.
      </video>
      <p>اضغط تشغيل للمشاهدة بالصوت على الجوال.</p>
      <nav aria-label="روابط الفيديو والموقع">
        <a class="primary" href="./nursing-hypotheses-motion-ar.mp4" download>تحميل الفيديو</a>
        <a href="/">زيارة الموقع</a>
      </nav>
    </main>
  </body>
</html>
