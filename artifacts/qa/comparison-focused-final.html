<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nursing Hypotheses focused comparison — final</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #071d35; color: #fff; font-family: Arial, sans-serif; }
      header { padding: 16px 20px; border-bottom: 1px solid #35516c; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
      figure { margin: 0; background: #fff; border: 1px solid #6c8295; overflow: hidden; }
      figcaption { padding: 9px 12px; color: #071d35; font-weight: 700; border-bottom: 1px solid #cbd6dd; }
      .crop { position: relative; height: 760px; overflow: hidden; }
      img { position: absolute; width: 1150px; max-width: none; height: auto; inset-block-start: -190px; inset-inline-start: -230px; }
    </style>
  </head>
  <body>
    <header>Focused clinical decision comparison — final pass</header>
    <main>
      <figure><figcaption>Source decision workspace</figcaption><div class="crop"><img src="reference-selected.jpg" alt="Focused source decision workspace" /></div></figure>
      <figure><figcaption>Rendered decision workspace</figcaption><div class="crop"><img src="scenario-reference-state-1280x910-normalized.png" alt="Focused rendered decision workspace" /></div></figure>
    </main>
  </body>
